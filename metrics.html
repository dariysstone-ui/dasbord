<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Метрика — Содержание территории</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--panel:#151921;--card:#1a2030;--b:#243044;--bl:#1e2d42;
  --t:#e2eaf6;--tm:#7a90b0;--td:#4a607e;--ac:#3b82f6;
  --ok:#10b981;--warn:#f59e0b;--er:#f43f5e;--r:10px
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:13px;min-height:100vh;padding:16px}
.wrap{max-width:1400px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--b);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hdr h2{font-size:16px;font-weight:700}
.badge{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.35);color:var(--ac);font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.fg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:700px){.fg{grid-template-columns:1fr 1fr}}
label{display:block;margin-bottom:4px;color:var(--tm);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
input[type=date],input[type=text]{width:100%;padding:9px 10px;background:var(--card);border:1px solid var(--bl);border-radius:8px;color:var(--t);font-size:13px;outline:none;transition:border-color .2s}
input[type=date]:focus,input[type=text]:focus{border-color:var(--ac)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:13px;transition:all .2s;white-space:nowrap;background:var(--ac);color:white}
.btn:hover{background:#2563eb}
.btn:disabled{opacity:.4;cursor:not-allowed}
.info{font-size:12px;color:var(--tm);padding:6px 0;min-height:20px}
.info.ok{color:var(--ok)}.info.err{color:var(--er)}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.sum-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
@media(max-width:900px){.sum-cards{grid-template-columns:repeat(3,1fr)}}
.sc{background:var(--card);border:1px solid var(--b);border-radius:8px;padding:12px 14px}
.sc-v{font-size:24px;font-weight:800;line-height:1}
.sc-l{font-size:10px;color:var(--tm);text-transform:uppercase;letter-spacing:.4px;margin-top:5px}
/* Method explanation box */
.method{background:var(--card);border:1px solid var(--bl);border-left:3px solid var(--ac);border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:12px;color:var(--tm);line-height:1.7}
.method b{color:var(--t)}
.method .formula{background:var(--panel);border:1px solid var(--b);border-radius:6px;padding:8px 12px;margin:8px 0;font-family:monospace;font-size:11px;color:#a5d8ff}
/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--card);padding:8px 10px;font-weight:600;color:var(--tm);text-align:left;border-bottom:2px solid var(--b);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:1}
th:hover{color:var(--t)}
th.asc::after{content:' ▲'}th.desc::after{content:' ▼'}
td{padding:7px 10px;border-bottom:1px solid var(--bl);vertical-align:middle}
tr:hover td{background:rgba(59,130,246,.04)}
.n{font-weight:700}
.dim{color:var(--tm)}
.chip{font-weight:700;padding:3px 8px;border-radius:4px;font-size:11px;white-space:nowrap;display:inline-block}
.chip-g{background:rgba(16,185,129,.18);color:#34d399}
.chip-y{background:rgba(245,158,11,.18);color:#fbbf24}
.chip-r{background:rgba(244,63,94,.18);color:#f87171}
.bar-w{width:100px;height:7px;background:var(--bl);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar-f{height:100%;border-radius:4px}
.bar-g{background:var(--ok)}.bar-y{background:var(--warn)}.bar-r{background:var(--er)}
.tbl-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.tbl-title{font-weight:600;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.pill-g{background:rgba(16,185,129,.15);color:var(--ok)}
.pill-y{background:rgba(245,158,11,.15);color:var(--warn)}
.pill-r{background:rgba(244,63,94,.15);color:var(--er)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
</head>
<body>
<div class="wrap">

<div class="panel">
  <div class="hdr">
    <h2>📐 Отклонение от метрики</h2>
    <span class="badge">Содержание территории</span>
  </div>
  <div class="fg">
    <div><label>Период: с</label><input type="date" id="dateFrom"></div>
    <div><label>Период: по</label><input type="date" id="dateTo"></div>
    <div><label>URL API</label><input type="text" id="apiUrl" value="/api" placeholder="https://dasbord-ashen.vercel.app/api"></div>
  </div>
  <button class="btn" id="genBtn" onclick="generate()">🚀 Сформировать</button>
  <div class="info" id="info"></div>
</div>

<div id="result" style="display:none">
  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    <button class="btn" id="pptxBtn" onclick="exportPptx()" style="background:#7c3aed">📊 Скачать PPTX</button>
    <button class="btn" id="xlsxBtn" onclick="exportXlsx()" style="background:#059669">📥 Скачать Excel</button>
  </div>
  <div class="sum-cards" id="summary"></div>
  <div class="method" id="method-box"></div>
  <div class="panel">
    <div class="tbl-hdr">
      <div class="tbl-title" id="tbl-title"></div>
      <input type="text" id="search" placeholder="🔍 Поиск ОМСУ..." oninput="renderTable()" style="width:200px;padding:7px 10px;background:var(--card);border:1px solid var(--bl);border-radius:8px;color:var(--t);font-size:12px;outline:none">
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th onclick="sortBy('rank')">#</th>
          <th onclick="sortBy('omsu')">ОМСУ</th>
          <th onclick="sortBy('metric')">Метрика</th>
          <th onclick="sortBy('actual')">Факт</th>
          <th onclick="sortBy('dev')">Отклонение</th>
          <th>Загрузка</th>
          <th onclick="sortBy('method')" style="font-size:10px">Метод расчёта</th>
        </tr></thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>
  </div>
  <!-- ЗАТО table -->
  <div class="panel" id="zato-section" style="display:none;margin-top:0">
    <div style="background:#1e2d42;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-weight:700;font-size:13px">
      Закрытые административно-территориальные образования (ЗАТО)
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>ОМСУ</th>
          <th>Метрика</th>
          <th>Факт</th>
          <th>Отклонение</th>
          <th style="font-size:10px">Метод расчёта</th>
        </tr></thead>
        <tbody id="zato-body"></tbody>
      </table>
    </div>
  </div>

</div>

const MONTH_IDX  = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const ZATO = new Set(['Восход','Молодежный','Краснознаменск','Власиха','Звездный городок']);
const MONTH_DAYS = [31,28,31,30,31,30,31,31,30,31,30,31];
const MONTH_RU   = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

// ═══════════════════════════════════════════════════════
// METRIC CALCULATION — universal for any period
// Logic:
//   daily_norm(omsu, date) = monthly_metric / days_in_month
//   metric(period) = sum of daily_norm for each day in period
//
// Special cases:
//   - Exactly 7 days inside one month  → weekly_norm = monthly / 4.33
//   - Full calendar month               → monthly metric directly
//   - Multi-month: each day uses its own month's daily norm
// ═══════════════════════════════════════════════════════
function calcMetric(omsu, fromStr, toStr) {
  const m = METRICS[omsu];
  if (!m) return { metric: null, method: 'нет данных', detail: [] };

  const from = new Date(fromStr + 'T00:00:00');
  const to   = new Date(toStr   + 'T00:00:00');
  const days = Math.round((to - from) / 86400000) + 1;

  const fromM = from.getMonth(); // 0-based
  const toM   = to.getMonth();
  const fromY = from.getFullYear();
  const toY   = to.getFullYear();

  const monthsInPeriod = [];
  const cur = new Date(from);
  const seen = new Set();
  while (cur <= to) {
    const k = `${cur.getFullYear()}-${cur.getMonth()}`;
    if (!seen.has(k)) {
      seen.add(k);
      monthsInPeriod.push({ y: cur.getFullYear(), m: cur.getMonth() });
    }
    cur.setDate(cur.getDate() + 1);
  }

  const detail = [];
  let totalMetric = 0;
  let methodLabel = '';

  if (monthsInPeriod.length === 1) {
    // Single month period
    const mo = MONTH_IDX[fromM];
    const monthMetric = m[mo] || 0;
    const daysInMonth = MONTH_DAYS[fromM];

    if (days === daysInMonth && fromM === toM) {
      // Full calendar month
      totalMetric = monthMetric;
      methodLabel = 'полный месяц';
      detail.push(`Полный ${mo}: метрика ${fmt(monthMetric)}`);
    } else if (days === 7) {
      // Exactly one week inside one month
      const weeklyNorm = Math.round(monthMetric / 4.33);
      totalMetric = weeklyNorm;
      methodLabel = 'недельный показатель';
      detail.push(`${mo}: ${fmt(monthMetric)} / 4,33 = ${fmt(weeklyNorm)} (на 7 дней)`);
    } else {
      // N days inside one month: daily = monthly/days_in_month
      const dailyNorm = monthMetric / daysInMonth;
      totalMetric = Math.round(dailyNorm * days);
      methodLabel = `дневная норма × ${days} дн.`;
      detail.push(`${mo}: ${fmt(monthMetric)} / ${daysInMonth} дн. × ${days} = ${fmt(totalMetric)}`);
    }
  } else {
    // Multi-month period — sum daily norms per month
    methodLabel = 'пропорционально по месяцам';
    for (const { y, m: mi } of monthsInPeriod) {
      const mo = MONTH_IDX[mi];
      const monthMetric = METRICS[omsu][mo] || 0;
      const daysInMonth = MONTH_DAYS[mi];

      // Count days of this month inside the period
      const mStart = new Date(y, mi, 1);
      const mEnd   = new Date(y, mi + 1, 0);
      const periodStart = mStart > from ? mStart : from;
      const periodEnd   = mEnd   < to   ? mEnd   : to;
      const daysInPeriod = Math.round((periodEnd - periodStart) / 86400000) + 1;

      const contribution = Math.round((monthMetric / daysInMonth) * daysInPeriod);
      totalMetric += contribution;
      detail.push(`${mo} (${daysInPeriod} из ${daysInMonth} дн.): ${fmt(monthMetric)} / ${daysInMonth} × ${daysInPeriod} = ${fmt(contribution)}`);
    }
  }

  return { metric: totalMetric, method: methodLabel, detail };
}

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let tableData = [];
let zatoData  = [];
let sortCol = 'dev', sortDir = 1;

// ═══════════════════════════════════════════════════════
// GENERATE
// ═══════════════════════════════════════════════════════
async function generate() {
  const fromStr = document.getElementById('dateFrom').value;
  const toStr   = document.getElementById('dateTo').value;
  const apiUrl  = document.getElementById('apiUrl').value.trim();
  if (!fromStr || !toStr) { setInfo('Выберите даты периода', 'err'); return; }
  if (new Date(fromStr) > new Date(toStr)) { setInfo('Дата начала позже даты конца', 'err'); return; }

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Загрузка...';
  setInfo('Запрос к API...', '');

  try {
    const resp = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        start: fromStr, end: toStr,
        compStart: fromStr, compEnd: toStr,
        omsuFilter: [], sourceFilter: [], subFilter: [],
        sgFilter: ['Содержание территории']
      })
    });
    if (!resp.ok) { const e = await resp.json().catch(() => ({})); throw new Error(e.error || `HTTP ${resp.status}`); }
    const json = await resp.json();

    const norm = s => s.toLowerCase().replace(/ё/g,'е').trim();
    const group = (json.data || []).find(g => norm(g.name).includes('содержание территории'));
    if (!group) { setInfo('Группа "Содержание территории" не найдена', 'err'); return; }

    // Actual counts by OMSU name
    window._metricsApiData = json; // save for xlsx export
    const actualMap = {};
    (group.omsus || []).forEach(o => { actualMap[o.name] = o.count || 0; });

    const days = Math.round((new Date(toStr) - new Date(fromStr)) / 86400000) + 1;
    const rows = [];

    Object.keys(METRICS).forEach(omsu => {
      const { metric, method, detail } = calcMetric(omsu, fromStr, toStr);
      if (!metric) return;
      const actual = actualMap[omsu] || 0;
      const dev = metric > 0 ? (actual / metric) - 1 : 0;
      rows.push({ omsu, metric, actual, dev, method, detail });
    });

    // Split: ЗАТО separate from main list
    const zatoRows = rows.filter(r => ZATO.has(r.omsu));
    const mainRows = rows.filter(r => !ZATO.has(r.omsu));
    mainRows.sort((a, b) => b.dev - a.dev);
    mainRows.forEach((r, i) => r.rank = i + 1);
    zatoRows.sort((a, b) => b.dev - a.dev);
    zatoRows.forEach((r, i) => r.rank = i + 1);
    tableData = mainRows;
    zatoData  = zatoRows;

    renderSummary(mainRows, days, fromStr, toStr);
    renderMethodBox(mainRows, fromStr, toStr, days);
    renderTable();

    window._metricsDates = { fromStr, toStr, days };
    document.getElementById('pptxBtn').disabled = false;
    document.getElementById('xlsxBtn').disabled = false;
    renderZato();
    setInfo(`✓ ${mainRows.length} ОМСУ + ${zatoRows.length} ЗАТО, период ${days} дн.`, 'ok');
    document.getElementById('result').style.display = 'block';

  } catch (err) {
    setInfo('Ошибка: ' + err.message, 'err');
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🚀 Сформировать';
  }
}

// ═══════════════════════════════════════════════════════
// RENDER SUMMARY
// ═══════════════════════════════════════════════════════
function renderSummary(rows, days, fromStr, toStr) {
  const red    = rows.filter(r => r.dev > 0.2).length;
  const yellow = rows.filter(r => r.dev > 0.1 && r.dev <= 0.2).length;
  const green  = rows.filter(r => r.dev <= 0.1).length;
  const totalActual = rows.reduce((s,r) => s + r.actual, 0);
  const totalMetric = rows.reduce((s,r) => s + r.metric, 0);
  const totalDev = totalMetric > 0 ? Math.round((totalActual / totalMetric - 1) * 100) : 0;
  const devColor = totalDev > 20 ? 'var(--er)' : totalDev > 10 ? 'var(--warn)' : 'var(--ok)';
  const fromRu = fmtDateRu(fromStr), toRu = fmtDateRu(toStr);
  const period = fromStr === toStr ? fromRu : `${fromRu} – ${toRu}`;
  document.getElementById('tbl-title').textContent = `${period} · ${days} дн.`;
  document.getElementById('summary').innerHTML = `
    <div class="sc"><div class="sc-v" style="color:var(--t)">${rows.length}</div><div class="sc-l">ОМСУ в расчёте</div></div>
    <div class="sc"><div class="sc-v" style="color:var(--ok)">${green}</div><div class="sc-l">🟢 Норма (до +10%)</div></div>
    <div class="sc"><div class="sc-v" style="color:var(--warn)">${yellow}</div><div class="sc-l">🟡 На контроле (+10–20%)</div></div>
    <div class="sc"><div class="sc-v" style="color:var(--er)">${red}</div><div class="sc-l">🔴 Разбор (&gt;+20%)</div></div>
    <div class="sc"><div class="sc-v" style="color:${devColor}">${totalDev > 0 ? '+' : ''}${totalDev}%</div><div class="sc-l">Общее отклонение</div></div>
  `;
}

// ═══════════════════════════════════════════════════════
// RENDER METHOD BOX — explain what was used
// ═══════════════════════════════════════════════════════
function renderMethodBox(rows, fromStr, toStr, days) {
  const methods = {};
  rows.forEach(r => { methods[r.method] = (methods[r.method] || 0) + 1; });
  const methodSummary = Object.entries(methods).map(([k,v]) => `<b>${k}</b> — ${v} ОМСУ`).join(' · ');

  const from = new Date(fromStr + 'T00:00:00');
  const to   = new Date(toStr   + 'T00:00:00');
  const fromM = MONTH_IDX[from.getMonth()];
  const toM   = MONTH_IDX[to.getMonth()];
  const spanMonths = fromM === toM ? fromM : `${fromM} → ${toM}`;

  let ruleText = '';
  const allMethods = Object.keys(methods);
  if (allMethods.length === 1 && allMethods[0] === 'полный месяц') {
    ruleText = `Период = полный календарный месяц → используется <b>месячная метрика</b> напрямую.`;
  } else if (allMethods.length === 1 && allMethods[0] === 'недельный показатель') {
    ruleText = `Период = ровно 7 дней в одном месяце → <b>недельная норма = месячная ÷ 4,33</b>.`;
  } else if (allMethods.length === 1 && allMethods[0].includes('дневная норма')) {
    ruleText = `Период ${days} дн. внутри одного месяца → <b>дневная норма = месячная ÷ кол-во дней в месяце × ${days}</b>.`;
  } else {
    ruleText = `Период захватывает несколько месяцев (<b>${spanMonths}</b>) → для каждого месяца считается дневная норма (месячная ÷ дней в месяце), умножается на количество дней этого месяца в периоде, результаты суммируются.`;
    ruleText += `<div class="formula">метрика = Σ (месячная_норма[M] / дней_в_месяце[M]) × дней_периода_в_M</div>`;
  }

  document.getElementById('method-box').innerHTML = `
    <b>📊 Метод расчёта метрики:</b><br>
    ${ruleText}<br>
    <span style="color:var(--td)">Использовано: ${methodSummary}</span>
  `;
}

// ═══════════════════════════════════════════════════════
// RENDER TABLE
// ═══════════════════════════════════════════════════════
function renderTable() {
  const q = document.getElementById('search').value.toLowerCase();
  const rows = q ? tableData.filter(r => r.omsu.toLowerCase().includes(q)) : tableData;
  const maxDev = Math.max(...rows.map(r => Math.abs(r.dev)), 0.01);

  document.getElementById('tbl-body').innerHTML = rows.map(r => {
    const pct = Math.round(r.dev * 100);
    const cls = r.dev >= 0.21 ? 'r' : r.dev >= 0.11 ? 'y' : 'g';
    const label = (pct >= 0 ? '+' : '') + pct + '%';
    const barW = Math.min(Math.abs(r.dev) / maxDev * 100, 100);
    const detailHtml = r.detail.map(d => `<div style="color:var(--td);font-size:10px;margin-top:2px">${d}</div>`).join('');
    return `<tr>
      <td class="dim">${r.rank}</td>
      <td class="n">${r.omsu}</td>
      <td class="dim">${fmt(r.metric)}</td>
      <td class="n">${fmt(r.actual)}</td>
      <td><span class="chip chip-${cls}">${label}</span></td>
      <td><div class="bar-w"><div class="bar-f bar-${cls}" style="width:${barW}%"></div></div></td>
      <td style="max-width:280px">${r.method}${detailHtml}</td>
    </tr>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════
// SORT
// ═══════════════════════════════════════════════════════
function sortBy(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
  tableData.sort((a, b) => {
    const av = a[col], bv = b[col];
    if (typeof av === 'string') return av.localeCompare(bv, 'ru') * sortDir;
    return ((av||0) - (bv||0)) * sortDir;
  });
  tableData.forEach((r, i) => r.rank = i + 1);
  document.querySelectorAll('th').forEach((th, i) => {
    th.className = '';
    const cols = ['rank','omsu','metric','actual','dev','bar','method'];
    if (cols[i] === sortCol) th.className = sortDir > 0 ? 'asc' : 'desc';
  });
  renderTable();
}

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function fmt(n) { return Math.round(n||0).toLocaleString('ru-RU').replace(/,/g,'\u00a0'); }
function fmtDateRu(s) {
  const d = new Date(s + 'T00:00:00');
  return `${d.getDate()} ${MONTH_RU[d.getMonth()]}`;
}
function renderZato() {
  if (!zatoData.length) { document.getElementById('zato-section').style.display='none'; return; }
  document.getElementById('zato-section').style.display='block';
  document.getElementById('zato-body').innerHTML = zatoData.map(r => {
    const pct = Math.round(r.dev * 100);
    const cls = r.dev > 0.2 ? 'r' : r.dev > 0.1 ? 'y' : 'g';
    const label = (pct >= 0 ? '+' : '') + pct + '%';
    const detailHtml = r.detail.map(d => `<div style="color:var(--td);font-size:10px;margin-top:2px">${d}</div>`).join('');
    return `<tr>
      <td class="n">${r.omsu}</td>
      <td class="dim">${fmt(r.metric)}</td>
      <td class="n">${fmt(r.actual)}</td>
      <td><span class="chip chip-${cls}">${label}</span></td>
      <td style="max-width:280px">${r.method}${detailHtml}</td>
    </tr>`;
  }).join('');
}

async function exportPptx() {
  if (!tableData.length) return;
  const btn = document.getElementById('pptxBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Генерация...';

  try {
    if (typeof JSZip === 'undefined') {
      await new Promise((res,rej)=>{ const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    }

    const { fromStr, toStr } = window._metricsDates;
    const from = new Date(fromStr+'T00:00:00'), to = new Date(toStr+'T00:00:00');
    const fmtD = d=>`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getFullYear()).slice(2)}`;
    const periodLabel = fromStr===toStr ? fmtD(from) : `${fmtD(from)}-${fmtD(to)}`;
    const title = `Мониторинг обращений граждан по тематике «Содержание территории» ${periodLabel}`;

    const xe = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const dc = dev => dev=>0.21?'C00000':dev=>0.11?'C07000':'1E7B1E';
    const EMU = in_ => Math.round(in_*914400);

    // ── Build one table cell ──
    function tc(text, {bg='FFFFFF',fg='000000',bold=0,sz=900,align='ctr',
                       font='Aptos Narrow',ml=36576,bw=6350,bc='C0C0C0'}={}) {
      return `<a:tc><a:txBody><a:bodyPr wrap="square"/><a:lstStyle/>` +
        `<a:p><a:pPr algn="${align}"/>` +
        `<a:r><a:rPr sz="${sz}" b="${bold}">` +
        `<a:solidFill><a:srgbClr val="${fg}"/></a:solidFill>` +
        `<a:latin typeface="${font}"/></a:rPr>` +
        `<a:t>${xe(text)}</a:t></a:r></a:p></a:txBody>` +
        `<a:tcPr marL="${ml}" marR="36576" marT="22860" marB="0" anchor="b">` +
        `<a:lnL w="${bw}"><a:solidFill><a:srgbClr val="${bc}"/></a:solidFill></a:lnL>` +
        `<a:lnR w="${bw}"><a:solidFill><a:srgbClr val="${bc}"/></a:solidFill></a:lnR>` +
        `<a:lnT w="${bw}"><a:solidFill><a:srgbClr val="${bc}"/></a:solidFill></a:lnT>` +
        `<a:lnB w="${bw}"><a:solidFill><a:srgbClr val="${bc}"/></a:solidFill></a:lnB>` +
        `<a:solidFill><a:srgbClr val="${bg}"/></a:solidFill></a:tcPr></a:tc>`;
    }

    // ── Build one table XML ──
    function buildTbl(rows, x, y, colW, hdrH, rowH) {
      const totalW = colW.reduce((a,b)=>a+b,0);
      const HBORDER = {bw:9525, bc:'FFFFFF'};
      const HDR = '2E3F5C';
      const hdrRow = `<a:tr h="${hdrH}">` +
        tc('ОМСУ',                              {bg:HDR,fg:'FFFFFF',bold:1,sz:1000,font:'Arial',align:'ctr',ml:36576,...HBORDER}) +
        tc(`Допустимое значение ${periodLabel}`,{bg:HDR,fg:'FFFFFF',bold:1,sz:1000,font:'Arial',align:'ctr',ml:36576,...HBORDER}) +
        tc(`Поступило ${periodLabel}`,          {bg:HDR,fg:'FFFFFF',bold:1,sz:1000,font:'Arial',align:'ctr',ml:36576,...HBORDER}) +
        tc('Отклонение',                        {bg:HDR,fg:'FFFFFF',bold:1,sz:1000,font:'Arial',align:'ctr',ml:36576,...HBORDER}) +
        `</a:tr>`;

      const dataRows = rows.map((r,ri)=>{
        const bg = ri%2===0?'FFFFFF':'F2F3F4';
        const pct = Math.round(r.dev*100);
        const ds = (pct>=0?'+':'')+pct+'%';
        return `<a:tr h="${rowH}">` +
          tc(r.omsu,        {bg,fg:'000000',sz:900,align:'l', ml:109728}) +
          tc(fmt(r.metric), {bg,fg:'000000',sz:900,align:'ctr'}) +
          tc(fmt(r.actual), {bg,fg:'000000',sz:900,align:'ctr'}) +
          tc(ds,            {bg,fg:dc(r.dev),sz:900,align:'ctr',bold:1}) +
          `</a:tr>`;
      }).join('');

      const grid = colW.map(w=>`<a:gridCol w="${w}"/>`).join('');
      const totalH = hdrH + rowH * rows.length;
      return `<p:graphicFrame>` +
        `<p:nvGraphicFramePr>` +
        `<p:cNvPr id="2" name="Table"/><p:cNvGraphicFramePr><a:graphicFrameLocks noGrp="1"/></p:cNvGraphicFramePr>` +
        `<p:nvPr/></p:nvGraphicFramePr>` +
        `<p:xfrm><a:off x="${x}" y="${y}"/><a:ext cx="${totalW}" cy="${totalH}"/></p:xfrm>` +
        `<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/table">` +
        `<a:tbl><a:tblPr firstRow="1" bandRow="1">` +
        `<a:tableStyleId>{5C22544A-7EE6-4342-B048-85BDC9FD1C3A}</a:tableStyleId>` +
        `</a:tblPr><a:tblGrid>${grid}</a:tblGrid>${hdrRow}${dataRows}</a:tbl>` +
        `</a:graphicData></a:graphic></p:graphicFrame>`;
    }

    const rows = tableData.slice();
    const half = Math.ceil(rows.length/2);
    const colW = [EMU(1.65),EMU(1.35),EMU(1.10),EMU(1.20)];
    const tblW = colW.reduce((a,b)=>a+b,0);
    const GAP  = EMU(0.22);
    const X0   = EMU(0.10);
    const X1   = X0+tblW+GAP;
    const Y0   = EMU(0.80);
    const HDR_H = EMU(0.65);
    const ROW_H = EMU(0.215);

    const leftTbl  = buildTbl(rows.slice(0,half),  X0, Y0, colW, HDR_H, ROW_H);
    const rightTbl = buildTbl(rows.slice(half),     X1, Y0, colW, HDR_H, ROW_H);

    const titleH = EMU(0.72);
    const titleXml = `<p:sp>` +
      `<p:nvSpPr><p:cNvPr id="1" name="TitleRect"/>` +
      `<p:cNvSpPr><a:spLocks noGrp="1"/></p:cNvSpPr><p:nvPr/></p:nvSpPr>` +
      `<p:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${EMU(13.333)}" cy="${titleH}"/></a:xfrm>` +
      `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom>` +
      `<a:solidFill><a:srgbClr val="1B4F8A"/></a:solidFill>` +
      `<a:ln><a:noFill/></a:ln></p:spPr>` +
      `<p:txBody><a:bodyPr marL="${EMU(0.15)}" marR="${EMU(0.12)}" marT="${EMU(0.08)}" marB="${EMU(0.04)}" anchor="ctr"/>` +
      `<a:lstStyle/><a:p><a:r>` +
      `<a:rPr sz="1400" b="1"><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill>` +
      `<a:latin typeface="Arial"/></a:rPr>` +
      `<a:t>${xe(title)}</a:t></a:r></a:p></p:txBody></p:sp>`;

    const slideXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n` +
      `<p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" ` +
      `xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ` +
      `xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">` +
      `<p:cSld><p:spTree>` +
      `<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>` +
      `<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/>` +
      `<a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>` +
      titleXml + leftTbl + rightTbl +
      `</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>`;

    // ── Build PPTX from template + new slide ──
    // Decode template (base64 → Uint8Array)
    const b64 = PPTX_TEMPLATE_B64;
    const bstr = atob(b64);
    const bytes = new Uint8Array(bstr.length);
    for (let i=0; i<bstr.length; i++) bytes[i] = bstr.charCodeAt(i);

    const zip = await JSZip.loadAsync(bytes);
    zip.file('ppt/slides/slide1.xml', slideXml);
    // Make sure slide1 rels exist
    if (!zip.file('ppt/slides/_rels/slide1.xml.rels')) {
      zip.file('ppt/slides/_rels/slide1.xml.rels',
        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n` +
        `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
        `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout6.xml"/>` +
        `</Relationships>`);
    }

    const blob = await zip.generateAsync({
      type:'blob',
      mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation',
      compression:'DEFLATE'
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`Метрика_${periodLabel}.pptx`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),10000);

  } catch(err) {
    alert('Ошибка: '+err.message); console.error(err);
  } finally {
    btn.disabled=false; btn.innerHTML='📊 Скачать PPTX';
  }
}


// ═══════════════════════════════════════════════════════
// XLSX EXPORT — sheet1: metric table + zato; sheet2: detail rows
// ═══════════════════════════════════════════════════════
async function exportXlsx() {
  if (!tableData.length) { alert('Сначала сформируйте отчёт'); return; }
  const btn = document.getElementById('xlsxBtn');
  btn.disabled = true; btn.textContent = '⏳ Загрузка данных...';

  const { fromStr, toStr } = window._metricsDates;
  const apiUrl = document.getElementById('apiUrl').value.trim();

  try {
    const wb = XLSX.utils.book_new();

    // ── Sheet 1: Сводная — with styling ──
    const periodLabel = fromStr === toStr ? fmtDateRu(fromStr) : `${fmtDateRu(fromStr)} – ${fmtDateRu(toStr)}`;
    const aoa1 = [];
    aoa1.push([`Мониторинг обращений по тематике «Содержание территории» ${periodLabel}`, '', '', '', '']);
    aoa1.push(['', '', '', '', '']);
    aoa1.push(['ОМСУ', 'Допустимое значение / Период', 'Поступило', 'Отклонение %', 'Метод расчёта']);

    tableData.forEach(r => {
      const pct = Math.round(r.dev * 100);
      aoa1.push([r.omsu, r.metric, r.actual, (pct >= 0 ? '+' : '') + pct + '%', r.method]);
    });

    const totMetric = tableData.reduce((s,r)=>s+r.metric,0);
    const totActual = tableData.reduce((s,r)=>s+r.actual,0);
    const totDev = totMetric > 0 ? Math.round((totActual/totMetric-1)*100) : 0;
    aoa1.push(['ИТОГО', totMetric, totActual, (totDev>=0?'+':'')+totDev+'%', '']);
    aoa1.push(['', '', '', '', '']);

    const zatoStartRow = aoa1.length;
    if (zatoData.length) {
      aoa1.push(['Закрытые административно-территориальные образования (ЗАТО)', '', '', '', '']);
      aoa1.push(['ОМСУ', 'Допустимое значение / Период', 'Поступило', 'Отклонение %', 'Метод расчёта']);
      zatoData.forEach(r => {
        const pct = Math.round(r.dev * 100);
        aoa1.push([r.omsu, r.metric, r.actual, (pct>=0?'+':'')+pct+'%', r.method]);
      });
    }

    const ws1 = XLSX.utils.aoa_to_sheet(aoa1);
    ws1['!cols'] = [{wch:30},{wch:24},{wch:12},{wch:14},{wch:28}];
    ws1['!merges'] = [
      {s:{r:0,c:0},e:{r:0,c:4}},
      ...(zatoData.length ? [{s:{r:zatoStartRow,c:0},e:{r:zatoStartRow,c:4}}] : [])
    ];
    ws1['!rows'] = [{hpt:18},{hpt:6},{hpt:22}];

    // Style helper
    const mainDataRows = tableData.length;
    const hdrRow = 2; // 0-indexed
    const dataStart = 3;
    const totRow = dataStart + mainDataRows;

    // Border style
    const bord = {style:'thin', color:{rgb:'BBBBBB'}};
    const bordB = {style:'medium', color:{rgb:'444444'}};
    const allBord = {top:bord, bottom:bord, left:bord, right:bord};

    // Style cells
    const styleCellRange = (ws, r1, c1, r2, c2, styleFn) => {
      for (let r=r1; r<=r2; r++) {
        for (let c=c1; c<=c2; c++) {
          const addr = XLSX.utils.encode_cell({r,c});
          if (!ws[addr]) ws[addr] = {v:'', t:'s'};
          ws[addr].s = styleFn(r, c, ws[addr].v);
        }
      }
    };

    // Title row
    const titleCell = ws1['A1'];
    if (titleCell) titleCell.s = {font:{bold:true, sz:13, color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'1B4F8A'}}, alignment:{horizontal:'left', vertical:'center', wrapText:true}};

    // Header row
    for (let c=0; c<5; c++) {
      const addr = XLSX.utils.encode_cell({r:hdrRow, c});
      if (!ws1[addr]) ws1[addr] = {v:'', t:'s'};
      ws1[addr].s = {font:{bold:true, sz:11, color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'2C3E50'}}, alignment:{horizontal:'center', vertical:'center', wrapText:true}, border:{top:{style:'thin',color:{rgb:'FFFFFF'}}, bottom:{style:'thin',color:{rgb:'FFFFFF'}}, left:{style:'thin',color:{rgb:'FFFFFF'}}, right:{style:'thin',color:{rgb:'FFFFFF'}}}};
    }

    // Data rows
    for (let ri=0; ri<mainDataRows; ri++) {
      const r = dataStart + ri;
      const rowData = tableData[ri];
      const pct = Math.round(rowData.dev * 100);
      const isEven = ri % 2 === 0;
      const bgRgb = isEven ? 'FFFFFF' : 'F2F3F4';
      for (let c=0; c<5; c++) {
        const addr = XLSX.utils.encode_cell({r, c});
        if (!ws1[addr]) ws1[addr] = {v:'', t:'s'};
        let fontColor = '000000';
        let bold = false;
        if (c === 3) {
          bold = true;
          fontColor = pct > 20 ? 'C00000' : pct > 10 ? 'C07000' : '1E7B1E';
        }
        ws1[addr].s = {
          font:{sz:11, color:{rgb:fontColor}, bold},
          fill:{fgColor:{rgb:bgRgb}},
          alignment:{horizontal: c===0 ? 'left' : 'center', vertical:'center'},
          border: allBord
        };
      }
    }

    // Totals row
    for (let c=0; c<5; c++) {
      const addr = XLSX.utils.encode_cell({r:totRow, c});
      if (!ws1[addr]) ws1[addr] = {v:'', t:'s'};
      const pctTot = totDev;
      let fontColor = '000000';
      if (c===3) fontColor = pctTot > 20 ? 'C00000' : pctTot > 10 ? 'C07000' : '1E7B1E';
      ws1[addr].s = {font:{bold:true, sz:11, color:{rgb:fontColor}}, fill:{fgColor:{rgb:'E8ECF0'}},
        alignment:{horizontal: c===0?'left':'center', vertical:'center'},
        border:{top:{style:'medium',color:{rgb:'444444'}}, bottom:{style:'medium',color:{rgb:'444444'}}, left:bord, right:bord}};
    }

    // ZATO header + rows
    if (zatoData.length) {
      const zatoHdrCell = ws1[XLSX.utils.encode_cell({r:zatoStartRow, c:0})];
      if (zatoHdrCell) zatoHdrCell.s = {font:{bold:true, sz:12, color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'1B4F8A'}}, alignment:{horizontal:'left', vertical:'center'}};
      const zatoTblHdr = zatoStartRow + 1;
      for (let c=0; c<5; c++) {
        const addr = XLSX.utils.encode_cell({r:zatoTblHdr, c});
        if (!ws1[addr]) ws1[addr] = {v:'', t:'s'};
        ws1[addr].s = {font:{bold:true, sz:11, color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'2C3E50'}}, alignment:{horizontal:'center', vertical:'center'}, border:allBord};
      }
      zatoData.forEach((zr, zi) => {
        const r = zatoTblHdr + 1 + zi;
        const pctZ = Math.round(zr.dev * 100);
        const bgRgb = zi%2===0?'FFFFFF':'F2F3F4';
        for (let c=0; c<5; c++) {
          const addr = XLSX.utils.encode_cell({r, c});
          if (!ws1[addr]) ws1[addr] = {v:'', t:'s'};
          let fontColor = '000000'; let bold=false;
          if (c===3){bold=true; fontColor = pctZ>20?'C00000':pctZ>10?'C07000':'1E7B1E';}
          ws1[addr].s = {font:{sz:11, color:{rgb:fontColor}, bold}, fill:{fgColor:{rgb:bgRgb}},
            alignment:{horizontal:c===0?'left':'center', vertical:'center'}, border:allBord};
        }
      });
    }

    XLSX.utils.book_append_sheet(wb, ws1, 'Сводная');

    // ── Sheet 2: Детализация — fetch raw rows from API ──
    btn.textContent = '⏳ Загрузка детализации...';

    const initResp = await fetch(apiUrl, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        start:fromStr, end:toStr, compStart:fromStr, compEnd:toStr,
        omsuFilter:[], sourceFilter:[], subFilter:[],
        sgFilter:['Содержание территории'],
        exportRaw:true
      })
    });
    if (!initResp.ok) throw new Error('Ошибка API: '+initResp.status);
    const init = await initResp.json();

    let chunk0cols = null;
    const csvLines = [];
    const { months, omsuFilter, sourceFilter, subFilter, sgFilter } = init;

    for (let i=0; i<months.length; i++) {
      btn.textContent = `⏳ ${months[i]} (${i+1}/${months.length})...`;
      const mr = await fetch(apiUrl, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          start:fromStr, end:toStr, compStart:fromStr, compEnd:toStr,
          omsuFilter, sourceFilter, subFilter, sgFilter,
          exportMonth:months[i]
        })
      });
      if (!mr.ok) continue;
      const mc = await mr.json();
      if (!chunk0cols && mc.cols) chunk0cols = mc.cols;
      for (const row of (mc.rows||[])) csvLines.push(row);
    }

    if (chunk0cols && csvLines.length) {
      function parseSemiCsv(line) {
        const fields=[]; let cur='',inQ=false;
        for (let i=0;i<line.length;i++) {
          const c=line[i];
          if(inQ){if(c==='"'&&line[i+1]==='"'){cur+='"';i++;}else if(c==='"')inQ=false;else cur+=c;}
          else if(c==='"')inQ=true;
          else if(c===';'){fields.push(cur);cur='';}
          else cur+=c;
        }
        fields.push(cur); return fields;
      }
      const aoa2 = [chunk0cols, ...csvLines.map(parseSemiCsv)];
      const ws2 = XLSX.utils.aoa_to_sheet(aoa2);
      ws2['!cols'] = chunk0cols.map(h => {
        if(h==='Описание') return {wch:60};
        if(h==='Факт'||h==='Подтема') return {wch:45};
        if(h==='Адрес') return {wch:50};
        return {wch:16};
      });
      XLSX.utils.book_append_sheet(wb, ws2, 'Детализация');
    }

    const from = new Date(fromStr+'T00:00:00'), to = new Date(toStr+'T00:00:00');
    const fmtD = d => `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
    const fname = `Метрика_${fmtD(from)}${fromStr===toStr?'':'_'+fmtD(to)}.xlsx`;
    XLSX.writeFile(wb, fname);

  } catch(err) {
    alert('Ошибка: '+err.message); console.error(err);
  } finally {
    btn.disabled = false; btn.textContent = '📥 Скачать Excel';
  }
}

function setInfo(msg, cls) {
  const el = document.getElementById('info');
  el.textContent = msg; el.className = 'info ' + (cls||'');
}

// Default dates
const today = new Date().toISOString().slice(0,10);
document.getElementById('dateFrom').value = today;
document.getElementById('dateTo').value   = today;
</script>
