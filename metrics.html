<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отклонение от метрики — Содержание территории</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--panel:#151921;--card:#1a2030;--b:#243044;--bl:#1e2d42;
  --t:#e2eaf6;--tm:#7a90b0;--td:#4a607e;--ac:#3b82f6;--ok:#10b981;--er:#f43f5e;
  --warn:#f59e0b;--r:10px
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:13px;min-height:100vh;padding:16px}
.wrap{max-width:1400px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--b);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hdr h2{font-size:16px;font-weight:700}
.badge{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.35);color:var(--ac);font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.fg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
@media(max-width:700px){.fg{grid-template-columns:1fr 1fr}}
label{display:block;margin-bottom:4px;color:var(--tm);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
input[type=date]{width:100%;padding:9px 10px;background:var(--card);border:1px solid var(--bl);border-radius:8px;color:var(--t);font-size:13px;outline:none;transition:border-color .2s}
input[type=date]:focus{border-color:var(--ac)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:12px;transition:all .2s;white-space:nowrap}
.btn-p{background:var(--ac);color:white}.btn-p:hover{background:#2563eb}
.btn-w{background:rgba(59,130,246,.15);color:var(--ac);border:1px solid rgba(59,130,246,.3)}.btn-w.active,.btn-w:hover{background:var(--ac);color:white;border-color:var(--ac)}
.btn-m{background:rgba(16,185,129,.15);color:var(--ok);border:1px solid rgba(16,185,129,.3)}.btn-m.active,.btn-m:hover{background:var(--ok);color:white;border-color:var(--ok)}
.btn-d{background:rgba(245,158,11,.15);color:var(--warn);border:1px solid rgba(245,158,11,.3)}.btn-d.active,.btn-d:hover{background:var(--warn);color:white;border-color:var(--warn)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.info{font-size:11px;color:var(--tm);padding:6px 0;min-height:20px}
.info.ok{color:var(--ok)}.info.err{color:var(--er)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--card);padding:8px 10px;font-weight:600;color:var(--tm);text-align:left;border-bottom:2px solid var(--b);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--t)}
th.sort-asc::after{content:' ▲'}
th.sort-desc::after{content:' ▼'}
td{padding:7px 10px;border-bottom:1px solid var(--bl);vertical-align:middle}
tr:hover td{background:rgba(59,130,246,.04)}
.omsu-name{font-weight:600}
.metric{color:var(--tm)}
.actual{font-weight:700}
.dev{font-weight:700;padding:3px 8px;border-radius:4px;font-size:11px;white-space:nowrap}
.dev.green{background:rgba(16,185,129,.2);color:#34d399}
.dev.yellow{background:rgba(245,158,11,.2);color:#fbbf24}
.dev.red{background:rgba(244,63,94,.2);color:#f87171}
.dev.under{background:rgba(16,185,129,.2);color:#34d399}
.bar-wrap{width:120px;height:8px;background:var(--bl);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar-fill{height:100%;border-radius:4px;transition:width .3s}
.bar-green{background:var(--ok)}
.bar-yellow{background:var(--warn)}
.bar-red{background:var(--er)}
.bar-under{background:var(--ok)}
.summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:900px){.summary-cards{grid-template-columns:repeat(2,1fr)}}
.sc{background:var(--card);border:1px solid var(--b);border-radius:8px;padding:12px 14px}
.sc-val{font-size:22px;font-weight:800;color:var(--ac);line-height:1}
.sc-lbl{font-size:10px;color:var(--tm);text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
.method-box{background:var(--card);border:1px solid var(--bl);border-radius:8px;padding:10px 14px;font-size:11px;color:var(--tm);line-height:1.6;margin-bottom:12px}

</head>

  <div class="info" id="info"></div>

</div>
</div>

const MONTH_NAMES = {5:'Май',6:'Июнь',7:'Июль',8:'Август'};
const DAYS_IN_MONTH = {5:31,6:30,7:31,8:31};

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let currentMode = 'week';
let tableData = [];

// ═══════════════════════════════════════════════════════
// MODE
// ═══════════════════════════════════════════════════════
const METHOD_DESC = {
  week: '<b>Недельный показатель:</b> метрика = нормативное значение жалоб за неделю для каждого ОМСУ (из плановых показателей июнь–август 2026). Используйте для анализа периода ~7 дней.',

};

function setMode(m) {
  currentMode = m;
  ['week','month','period'].forEach(x => {
    document.getElementById('mode-'+x).classList.toggle('active', x===m);
  });
  document.getElementById('method-desc').innerHTML = METHOD_DESC[m];
}

// ═══════════════════════════════════════════════════════
// METRIC CALCULATION
// ═══════════════════════════════════════════════════════
function getMonthName(monthNum) { return MONTH_NAMES[monthNum] || null; }

function calcMetric(omsu, fromStr, toStr, mode) {
  const from = new Date(fromStr), to = new Date(toStr);
  const mn = getMonthName(from.getMonth()+1);

  if (mode === 'week') {
    // Sum daily norms (weekly/7) for each day — handles different monthly norms correctly
    if (!WEEKLY[omsu]) return null;
    let total = 0, valid = false;
    const cur = new Date(from);
    while (cur <= to) {
      const mn2 = getMonthName(cur.getMonth()+1);
      const weeklyNorm = mn2 && WEEKLY[omsu][mn2] ? WEEKLY[omsu][mn2] : null;
      if (weeklyNorm !== null) { total += weeklyNorm / 7; valid = true; }
      cur.setDate(cur.getDate()+1);
    }
    return valid ? Math.round(total) : null;
  }
  if (mode === 'month') {
    // Sum daily norms (monthly/days_in_month) for each day
    if (!MONTHLY[omsu]) return null;
    let total = 0, valid = false;
    const cur = new Date(from);
    while (cur <= to) {
      const m = cur.getMonth()+1;
      const mn2 = getMonthName(m);
      const monthlyNorm = mn2 && MONTHLY[omsu][mn2] ? MONTHLY[omsu][mn2] : null;
      if (monthlyNorm !== null) {
        total += monthlyNorm / (DAYS_IN_MONTH[m] || 30);
        valid = true;
      }
      cur.setDate(cur.getDate()+1);
    }
    return valid ? Math.round(total) : null;
  }
  // mode === 'period': sum daily norms (weekly/7) for each day
  if (!WEEKLY[omsu]) return null;
  let total = 0;
  const cur = new Date(from);
  while (cur <= to) {
    const mn2 = getMonthName(cur.getMonth()+1);
    const weeklyNorm = mn2 && WEEKLY[omsu][mn2] ? WEEKLY[omsu][mn2] : null;
    if (weeklyNorm === null) { cur.setDate(cur.getDate()+1); continue; }
    total += weeklyNorm / 7;
    cur.setDate(cur.getDate()+1);
  }
  return Math.round(total);
}

  const apiUrl  = document.getElementById('apiUrl').value.trim();

  if (!fromStr || !toStr) { setInfo('Выберите даты периода','err'); return; }
  if (new Date(fromStr) > new Date(toStr)) { setInfo('Дата начала позже даты конца','err'); return; }

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Загрузка...';
  setInfo('Запрос к API...','');

  try {
    const resp = await fetch(apiUrl, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        start: fromStr, end: toStr,
        compStart: fromStr, compEnd: toStr,
        omsuFilter:[], sourceFilter:[], subFilter:[], sgFilter:['Содержание территории']
      })
    });
    if (!resp.ok) { const e = await resp.json().catch(()=>({})); throw new Error(e.error||`HTTP ${resp.status}`); }
    const json = await resp.json();

    // Find Содержание территории group
    const norm = s => s.toLowerCase().replace(/ё/g,'е').trim();
    const group = (json.data||[]).find(g => norm(g.name).includes('содержание территории'));
    if (!group) { setInfo('Группа "Содержание территории" не найдена в данных','err'); return; }

    // Build table rows from OMSU data
    const days = Math.round((new Date(toStr)-new Date(fromStr))/86400000)+1;
    const rows = [];

    // Build actual count map from API
    const actualMap = {};
    (group.omsus||[]).forEach(o => { actualMap[o.name] = o.count||0; });

    // For each OMSU in metric data
    Object.keys(WEEKLY).forEach(omsu => {
      const metric = calcMetric(omsu, fromStr, toStr, currentMode);
      if (metric === null || metric === 0) return;

      const actual = actualMap[omsu] || 0;
      const dev = (actual / metric) - 1; // deviation: 0 = exact, >0 = over, <0 = under
      rows.push({ omsu, metric, actual, dev, days });
    });

    // Sort by deviation descending (most over first)
    rows.sort((a,b) => b.dev - a.dev);
    rows.forEach((r,i) => r.rank = i+1);

    tableData = rows;
    renderSummary(rows, days, fromStr, toStr);
    renderTable(rows);

    setInfo(`✓ Загружено ${rows.length} ОМСУ, период ${days} дн.`,'ok');
    document.getElementById('result').style.display = 'block';

  } catch(err) {
    setInfo('Ошибка: '+err.message,'err');
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🚀 Сформировать';
  }
}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════
function renderSummary(rows, days, fromStr, toStr) {
  const over = rows.filter(r=>r.dev>0.1).length;
  const under = rows.filter(r=>r.dev<-0.1).length;
  const ontrack = rows.length - over - under;
  const totalActual = rows.reduce((s,r)=>s+r.actual,0);
  const totalMetric = rows.reduce((s,r)=>s+r.metric,0);
  const totalDev = totalMetric>0 ? Math.round((totalActual/totalMetric-1)*100) : 0;

  const modeLabel = currentMode==='week'?'неделя':currentMode==='month'?'месяц':'период';
  const fromRu = new Date(fromStr).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  const toRu   = new Date(toStr).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  const periodLabel = fromStr===toStr ? fromRu : `${fromRu} – ${toRu}`;

  document.getElementById('tbl-title').textContent = `${periodLabel} · ${days} дн. · режим: ${modeLabel}`;
  document.getElementById('summary').innerHTML = `
    <div class="sc"><div class="sc-val" style="color:var(--t)">${rows.length}</div><div class="sc-lbl">ОМСУ в расчёте</div></div>
    <div class="sc"><div class="sc-val" style="color:var(--er)">${rows.filter(r=>r.dev>0.2).length} 🔴 / ${rows.filter(r=>r.dev>0.1&&r.dev<=0.2).length} 🟡</div><div class="sc-lbl">Превышают (+20% / +10–20%)</div></div>
    <div class="sc"><div class="sc-val" style="color:var(--ok)">${under}</div><div class="sc-lbl">Ниже метрики (зелёные)</div></div>
    <div class="sc"><div class="sc-val" style="color:${totalDev>10?'var(--er)':totalDev<-10?'var(--ok)':'var(--ac)'}">${totalDev>0?'+':''}${totalDev}%</div><div class="sc-lbl">Общее отклонение</div></div>
  `;
}

function renderTable(rows) {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = q ? rows.filter(r=>r.omsu.toLowerCase().includes(q)) : rows;
  const maxDev = Math.max(...filtered.map(r=>Math.abs(r.dev)), 0.01);

  document.getElementById('tbl-body').innerHTML = filtered.map(r => {
    const devPct = Math.round(r.dev*100);
    // Color by how much OVER metric: ≤10% green, 10-20% yellow, >20% red; under metric always green
    const devClass = r.dev < 0 ? 'under' : r.dev <= 0.1 ? 'green' : r.dev <= 0.2 ? 'yellow' : 'red';
    const devLabel = (devPct>0?'+':'')+devPct+'%';
    const barW = Math.min(Math.abs(r.dev)/maxDev*100,100);
    const barClass = r.dev < 0 ? 'bar-under' : r.dev <= 0.1 ? 'bar-green' : r.dev <= 0.2 ? 'bar-yellow' : 'bar-red';
    return `<tr>
      <td style="color:var(--td)">${r.rank}</td>
      <td class="omsu-name">${r.omsu}</td>
      <td class="metric">${fmt(r.metric)}</td>
      <td class="actual">${fmt(r.actual)}</td>
      <td><span class="dev ${devClass}">${devLabel}</span></td>
      <td><div class="bar-wrap"><div class="bar-fill ${barClass}" style="width:${barW}%"></div></div></td>
    </tr>`;
  }).join('');
}

function filterTable() { renderTable(tableData); }

function sortBy(col) {
  if (sortCol===col) sortDir *= -1; else { sortCol=col; sortDir=1; }
  tableData.sort((a,b)=>{
    let av=a[col], bv=b[col];
    if(typeof av==='string') return av.localeCompare(bv,'ru')*sortDir;
    return (av-bv)*sortDir;
  });
  tableData.forEach((r,i)=>r.rank=i+1);
  document.querySelectorAll('th').forEach(th=>th.className='');
  document.querySelectorAll('th').forEach((th,i)=>{
    const cols=['rank','omsu','metric','actual','dev','bar'];
    if(cols[i]===sortCol) th.className='sort-'+(sortDir>0?'asc':'desc');
  });
  renderTable(tableData);
}

function fmt(n){ return Math.round(n||0).toLocaleString('ru-RU').replace(/,/g,'\u00a0'); }
function setInfo(msg,cls){ const el=document.getElementById('info'); el.textContent=msg; el.className='info '+(cls||''); }

// Set today as default
const today = new Date().toISOString().slice(0,10);
document.getElementById('dateFrom').value = today;
document.getElementById('dateTo').value = today;
</script>
