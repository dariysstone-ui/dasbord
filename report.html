<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор отчёта — API</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .upload-section { background: white; border-radius: 15px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { color: #333; margin-bottom: 20px; text-align: center; font-size: 28px; }
        .file-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .file-group label { font-weight: 600; margin-bottom: 8px; color: #555; font-size: 14px; }
        input[type="date"], input[type="text"], input[type="url"], textarea { padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; width: 100%; font-family: inherit; }
        input[type="date"]:focus, input[type="url"]:focus { border-color: #667eea; outline: none; }
        textarea { min-height: 80px; resize: vertical; }
        .date-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .comparison-dates { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 2px dashed #667eea; }
        .comparison-dates h3 { color: #667eea; margin-bottom: 12px; font-size: 16px; }
        .hint { font-size: 12px; color: #666; margin-top: 8px; }
        .btn { padding: 14px 32px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; width: 100%; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        .btn-secondary { background: #28a745; color: white; margin-top: 10px; margin-right: 10px; }
        .btn-secondary:hover { background: #218838; }
        .btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }
        .info-box { background: #e7f3ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .info-box.warn { background: #fff3cd; }
        .progress { display: none; background: white; border-radius: 15px; padding: 40px; margin-top: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .progress-bar { width: 100%; height: 30px; background: #f0f0f0; border-radius: 15px; overflow: hidden; margin-bottom: 15px; }
        .progress-fill { height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); width: 0%; transition: width 0.3s; }
        .progress-text { text-align: center; font-size: 16px; color: #333; }
        .tabs-container { display: none; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border: none; background: #e0e0e0; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.3s; }
        .tab-btn.active { background: #667eea; color: white; }
        .tab-btn:hover:not(.active) { background: #d0d0d0; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        #report { display: none; background: white; border-radius: 15px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .report-header { text-align: center; border-bottom: 4px solid #2c5aff; padding-bottom: 20px; margin-bottom: 30px; }
        .report-title { font-size: 32px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .report-periods { font-size: 14px; color: #888; margin-top: 3px; }
        .report-periods .current { color: #3498DB; font-weight: 600; }
        .report-periods .compare { color: #95A5A6; }
        .summary { text-align: center; font-size: 20px; margin-bottom: 30px; padding: 20px; background: #f8f9fa; border-radius: 10px; }
        .summary-highlight { font-weight: bold; font-size: 24px; }
        .positive { color: #28a745; }
        .negative { color: #dc3545; }
        .tables-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        .table-wrapper { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .table-header { background: #f8f9fa; padding: 12px; text-align: center; font-weight: bold; border-bottom: 2px solid #ddd; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { background: #f0f0f0; padding: 6px 3px; font-weight: 600; text-align: center; border-bottom: 1px solid #ddd; }
        td { padding: 5px 3px; text-align: center; border-bottom: 1px solid #eee; }
        .row-red { background: #ffe6e6 !important; }
        .row-yellow { background: #fff9e6 !important; }
        .row-green { background: #d4edda !important; }
        .coef-cell { font-weight: 600; padding: 3px 6px; border-radius: 3px; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .bottom-section { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; padding-top: 30px; border-top: 2px solid #eee; }
        .avg-coef { text-align: center; padding: 20px; background: #e7f3ff; border-radius: 10px; }
        .avg-coef-value { font-size: 36px; font-weight: bold; color: #2c5aff; }
        .topics-list { padding: 20px; background: #f8f9fa; border-radius: 10px; }
        .topic-item { padding: 10px; margin-bottom: 8px; background: white; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .loading { display: none; text-align: center; padding: 40px; color: white; font-size: 20px; }
        .spinner { border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media print {
            body { background: white; padding: 0; }
            .upload-section, .btn-secondary, .tabs-container { display: none !important; }
            #report { display: block; box-shadow: none; }
            .tab-content { display: block !important; page-break-after: always; }
            .tab-content:last-child { page-break-after: avoid; }
        }
        @media (max-width: 1200px) {
            .tables-container { grid-template-columns: 1fr; }
            .date-inputs { grid-template-columns: 1fr; }
        }
        #pdf-export-container { position: absolute; left: -9999px; top: 0; width: 297mm; background: white; }
    </style>
</head>
<body>
<div class="container">
    <div class="upload-section">
        <h1>📊 Генератор отчёта</h1>

        <div class="info-box">
            💡 Данные загружаются с дашборда автоматически через API. Файл численности населения встроен.
        </div>

        <div class="file-group" style="margin-bottom:20px">
            <label>🌐 URL API дашборда:</label>
            <input type="url" id="apiUrl" placeholder="https://dasbord-ashen.vercel.app/api" value="https://dasbord-ashen.vercel.app/api" />
            <div class="hint">Адрес вашего Vercel приложения + /api</div>
        </div>

        <div class="date-inputs">
            <div class="file-group">
                <label>📅 Основной период: начало</label>
                <input type="date" id="startDate" />
            </div>
            <div class="file-group">
                <label>📅 Основной период: конец</label>
                <input type="date" id="endDate" />
            </div>
        </div>

        <div class="comparison-dates">
            <h3>🔄 Период для сравнения</h3>
            <div class="date-inputs" style="margin-bottom:0">
                <div class="file-group">
                    <label>Сравнение: начало</label>
                    <input type="date" id="compareStartDate" />
                </div>
                <div class="file-group">
                    <label>Сравнение: конец</label>
                    <input type="date" id="compareEndDate" />
                </div>
            </div>
            <div class="hint">💡 Если не заполнено — динамика = 0</div>
        </div>

        <div class="file-group">
            <label>📋 Группы (формат: "Префикс | Название группы"):</label>
            <textarea id="synthGroups">ДВОР | Содержание территории
ДВОР | МКД
ДВОР | Контейнерная площадка
ДОРОГИ | Содержание муниципальных дорог</textarea>
        </div>

        <button class="btn btn-primary" onclick="generateReport()" id="generateBtn">
            🚀 Сгенерировать отчёт
        </button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Загрузка данных с API...</div>
    </div>

    <div class="tabs-container" id="tabsContainer">
        <div class="tabs" id="tabs"></div>
    </div>

    <div id="report"></div>
    <div id="pdf-export-container"></div>

    <div class="progress" id="progress">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Генерация...</div>
    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// НАСЕЛЕНИЕ МО — встроенная константа из MO.xlsx
// ═══════════════════════════════════════════════════════
const MO_POPULATION_RAW = {"Городской округ Балашиха":569040,"Богородский городской округ":222878,"Городской округ Бронницы":21050,"Городской округ Власиха":28556,"Волоколамский городской округ":64353,"Городской округ Воскресенск":161862,"Городской округ Восход":2056,"Городской округ Дзержинский":57308,"Дмитровский городской округ":168673,"Городской округ Долгопрудный":118760,"Городской округ Домодедово":231034,"Городской округ Дубна":74223,"Городской округ Егорьевск":111529,"Городской округ Жуковский":109831,"Городской округ Зарайск":36444,"Городской округ Звездный городок":7559,"Городской округ Истра":172195,"Городской округ Кашира":66093,"Городской округ Клин":149813,"Городской округ Коломна":215146,"Городской округ Королёв":226477,"Городской округ Котельники":75289,"Городской округ Красногорск":345865,"Городской округ Краснознаменск":44687,"Ленинский городской округ":342130,"Городской округ Лобня":82353,"Городской округ Лосино-Петровский":74266,"Городской округ Лотошино":21850,"Городской округ Луховицы":61324,"Городской округ Лыткарино":66930,"Городской округ Люберцы":391176,"Можайский городской округ":93410,"Городской округ Молодёжный":2838,"Городской округ Мытищи":314245,"Наро-Фоминский городской округ":201751,"Одинцовский городской округ":488473,"Орехово-Зуевский городской округ":240786,"Павлово-Посадский городской округ":122800,"Городской округ Подольск":351752,"Пушкинский городской округ":303588,"Раменский городской округ":326038,"Городской округ Реутов":118065,"Рузский городской округ":80478,"Сергиево-Посадский городской округ":208982,"Городской округ Серебряные Пруды":23325,"Городской округ Серпухов":239430,"Городской округ Солнечногорск":140933,"Городской округ Ступино":118452,"Талдомский городской округ":64680,"Городской округ Фрязино":58554,"Городской округ Химки":280221,"Городской округ Черноголовка":21197,"Городской округ Чехов":149055,"Городской округ Шатура":100601,"Городской округ Шаховская":29919,"Городской округ Щёлково":223423,"Городской округ Электросталь":151989,"Московская область":8775735};

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let globalData = {
    startDate: null, endDate: null,
    compareStartDate: null, compareEndDate: null,
    hasComparison: false,
    groups: [],
    groupsResults: {},
    allPopulation: 0, popMap: {}
};

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function normText(x) {
    if (!x && x !== 0) return '';
    return String(x).trim().replace(/\s+/g, ' ').replace(/ё/g, 'е').replace(/Ё/g, 'Е');
}

function cleanOmsuName(x) {
    x = normText(x);
    x = x.replace(/^администрация\s+/i, '');
    x = x.replace(/^г\.\s*о\.\s*/i, '');
    x = x.replace(/^г\.о\.\s*/i, '');
    x = x.replace(/^городской округ\s+/i, '');
    x = x.replace(/^богородский городской округ$/i, 'Богородский');
    x = x.replace(/ городской округ$/i, '');
    x = x.replace(/^муниципальный округ\s+/i, '');
    x = x.replace(/^муниципальный район\s+/i, '');
    return x.trim().replace(/^-+|-+$/g, '');
}

function fmtInt(v) { return Math.floor(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function fmtDyn(v) { v = Math.floor(v); if (v > 0) return `+${v}`; if (v < 0) return `${v}`; return '0'; }
function fmtCoef(v) { return String(Math.round(v * 10) / 10).replace('.', ','); }
function formatDate(date) { return date.toLocaleDateString('ru-RU'); }

function classifyPop(pop) {
    if (pop < 100000) return '< 100 тыс. человек';
    if (pop < 200000) return '100 - 200 тыс. человек';
    return '> 200 тыс. человек';
}
function getCoefficientColor(coef, maxCoef) {
    if (maxCoef === 0) return { bg: '#28a745', text: 'white' };
    const ratio = Math.min(coef / maxCoef, 1);
    const r = Math.round(40 + ratio * 215);
    const g = Math.round(167 - ratio * 127);
    const b = Math.round(69 - ratio * 29);
    return { bg: `rgb(${r}, ${g}, ${b})`, text: 'white' };
}
function getRowColorClass(coef, oblastCoef) {
    if (coef >= oblastCoef) return 'row-red';
    const diff = oblastCoef - coef;
    const threshold = oblastCoef < 1 ? 0.1 : 0.3;
    if (diff < threshold) return 'row-yellow';
    return 'row-green';
}
function parseGroups(text) {
    return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
        if (line.includes('|')) {
            const p = line.split('|').map(s => s.trim());
            return { prefix: p[0] || 'ДВОР', name: p[1] || p[0] };
        }
        return { prefix: 'ДВОР', name: line };
    });
}

// ═══════════════════════════════════════════════════════
// BUILD POPULATION MAP from embedded MO data
// Keys in MO_POPULATION_RAW use full names ("Городской округ Балашиха")
// We need to map them to short names used in dashboard ("Балашиха")
// ═══════════════════════════════════════════════════════
function buildPopMap() {
    const popMap = {};
    let total = 0;
    for (const [rawName, pop] of Object.entries(MO_POPULATION_RAW)) {
        const short = cleanOmsuName(rawName);
        if (short && !'московская область'.includes(short.toLowerCase())) {
            popMap[short] = (popMap[short] || 0) + pop;
            total += pop;
        }
    }
    return { popMap, allPopulation: total };
}

// ═══════════════════════════════════════════════════════
// API CALL
// ═══════════════════════════════════════════════════════
async function fetchFromAPI(apiUrl, start, end, compStart, compEnd) {
    const body = {
        start, end,
        compStart: compStart || start,
        compEnd: compEnd || end,
        omsuFilter: [],
        sourceFilter: []
    };
    const resp = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error || `Ошибка API: ${resp.status}`);
    }
    return resp.json();
}

// ═══════════════════════════════════════════════════════
// MAIN GENERATE
// ═══════════════════════════════════════════════════════
async function generateReport() {
    const apiUrl    = document.getElementById('apiUrl').value.trim();
    const startStr  = document.getElementById('startDate').value;
    const endStr    = document.getElementById('endDate').value;
    const cmpStartStr = document.getElementById('compareStartDate').value;
    const cmpEndStr   = document.getElementById('compareEndDate').value;
    const groupsText  = document.getElementById('synthGroups').value;

    if (!apiUrl)        { alert('Введите URL API!'); return; }
    if (!startStr || !endStr) { alert('Выберите основной период!'); return; }
    if (!groupsText.trim()) { alert('Введите хотя бы одну группу!'); return; }

    const groups = parseGroups(groupsText);
    const hasComparison = !!(cmpStartStr && cmpEndStr);

    document.getElementById('loading').style.display = 'block';
    document.getElementById('report').style.display = 'none';
    document.getElementById('tabsContainer').style.display = 'none';
    document.getElementById('generateBtn').disabled = true;

    try {
        // ── Step 1: Build population map
        document.getElementById('loadingText').textContent = 'Подготовка данных населения...';
        const { popMap, allPopulation } = buildPopMap();

        // ── Step 2: Fetch from API
        document.getElementById('loadingText').textContent = 'Загрузка данных с API...';
        const apiData = await fetchFromAPI(apiUrl, startStr, endStr, cmpStartStr || startStr, cmpEndStr || endStr);

        // apiData.data = [ { name, total, compTotal, subs, omsus, ... } ]
        // We need to process it per synth group
        // Build lookup: groupName -> { total, compTotal, omsus: [{name,count,dynAbs,...}], subs: [...] }
        const groupMap = {};
        for (const item of (apiData.data || [])) {
            groupMap[normText(item.name)] = item;
        }

        const startDate = new Date(startStr); startDate.setHours(0,0,0,0);
        const endDate   = new Date(endStr);   endDate.setHours(23,59,59,999);
        const cmpStartDate = hasComparison ? new Date(cmpStartStr) : null;
        const cmpEndDate   = hasComparison ? new Date(cmpEndStr)   : null;
        if (cmpStartDate) cmpStartDate.setHours(0,0,0,0);
        if (cmpEndDate)   cmpEndDate.setHours(23,59,59,999);

        globalData = {
            startDate, endDate, cmpStartDate, cmpEndDate,
            compareStartDate: cmpStartDate, compareEndDate: cmpEndDate,
            hasComparison, groups,
            groupsResults: {}, popMap, allPopulation
        };

        // ── Step 3: Process each group
        const reportContainer = document.getElementById('report');
        const tabsContainer   = document.getElementById('tabs');
        reportContainer.innerHTML = '';
        tabsContainer.innerHTML   = '';

        for (let idx = 0; idx < groups.length; idx++) {
            const { prefix, name: synthGroup } = groups[idx];
            document.getElementById('loadingText').textContent = `Обработка группы: ${synthGroup}...`;

            // Find matching item in API response
            const normGroup = normText(synthGroup);
            const item = groupMap[normGroup] || Object.entries(groupMap).find(([k]) =>
                k.toLowerCase().includes(normGroup.toLowerCase()) ||
                normGroup.toLowerCase().includes(k.toLowerCase())
            )?.[1];

            if (!item) {
                console.warn(`Group not found in API: ${synthGroup}`);
            }

            const curTotal = item?.total || 0;
            const cmpTotal = item?.compTotal || 0;
            const totalDyn = curTotal - cmpTotal;
            const oblastCoef = allPopulation > 0 ? (curTotal / allPopulation) * 10000 : 0;

            // Build OMSU stats from API omsus list
            const omsuStats = {};
            // Current period
            for (const o of (item?.omsus || [])) {
                const shortName = cleanOmsuName(o.name);
                const pop = popMap[shortName] || 0;
                if (!pop) continue;
                omsuStats[shortName] = {
                    last: o.count || 0,
                    prev: cmpTotal > 0 ? (o.count - (o.dynAbs || 0)) : 0,
                    pop,
                    dyn: o.dynAbs || 0
                };
            }

            const omsuList = Object.entries(omsuStats)
                .map(([omsu, s]) => ({
                    omsu, last: s.last, prev: s.prev, pop: s.pop,
                    coef: s.pop > 0 ? (s.last / s.pop) * 10000 : 0,
                    dyn: s.dyn,
                    band: classifyPop(s.pop)
                }))
                .filter(o => o.pop > 0)
                .sort((a, b) => b.coef - a.coef);

            const bands = { '< 100 тыс. человек': [], '100 - 200 тыс. человек': [], '> 200 тыс. человек': [] };
            omsuList.forEach(o => bands[o.band].push(o));

            const bandMaxCoefs = {};
            Object.keys(bands).forEach(band => {
                bands[band].sort((a, b) => b.coef - a.coef);
                bandMaxCoefs[band] = Math.max(...bands[band].map(i => i.coef), 0.1);
                bands[band].forEach((it, i) => it.rank = i + 1);
            });

            // Topics from subs
            const topics = (item?.subs || [])
                .slice(0, 3)
                .map(s => ({
                    topic: s.name,
                    count: s.count || 0,
                    cmpCount: Math.max(0, (s.count || 0) - (s.dynAbs || 0)),
                    dyn: s.dynAbs || 0,
                    share: curTotal > 0 ? ((s.count || 0) / curTotal) * 100 : 0
                }));

            globalData.groupsResults[synthGroup] = {
                prefix, synthGroup, curTotal, cmpTotal, totalDyn, oblastCoef,
                bands, topics, bandMaxCoefs
            };

            // ── Render tab
            const tabBtn = document.createElement('button');
            tabBtn.className = `tab-btn ${idx === 0 ? 'active' : ''}`;
            tabBtn.textContent = `${prefix} «${synthGroup}»`;
            tabBtn.onclick = () => switchTab(idx);
            tabsContainer.appendChild(tabBtn);

            const tabContent = document.createElement('div');
            tabContent.id = `group-${idx}`;
            tabContent.className = `tab-content ${idx === 0 ? 'active' : ''}`;

            const dateFrom = formatDate(startDate);
            const dateTo   = formatDate(endDate);
            const dynClass = totalDyn <= 0 ? 'positive' : 'negative';
            const dynText  = totalDyn < 0 ? 'снижение' : totalDyn > 0 ? 'рост' : 'без изменений';

            const periodsHTML = `<div class="report-periods">
                <span class="current">📊 ${dateFrom} — ${dateTo}</span>
                ${hasComparison ? ` <span class="compare">vs ${formatDate(cmpStartDate)} — ${formatDate(cmpEndDate)}</span>` : ''}
            </div>`;

            const bandOrder = ['< 100 тыс. человек', '100 - 200 тыс. человек', '> 200 тыс. человек'];
            let tablesHTML = '';
            bandOrder.forEach(bandName => {
                const items = bands[bandName];
                if (!items.length) return;
                const maxRows = Math.min(items.length, bandName === '< 100 тыс. человек' ? 22 : 18);
                const bandMaxCoef = bandMaxCoefs[bandName];
                let rows = '';
                for (let i = 0; i < maxRows; i++) {
                    const it = items[i];
                    const rowClass = getRowColorClass(it.coef, oblastCoef);
                    const cc = getCoefficientColor(it.coef, bandMaxCoef);
                    const dynCls = it.dyn < 0 ? 'positive' : it.dyn > 0 ? 'negative' : '';
                    rows += `<tr class="${rowClass}">
                        <td>${it.rank}</td>
                        <td style="text-align:left;padding-left:5px">${it.omsu}</td>
                        <td><span class="coef-cell" style="background:${cc.bg};color:${cc.text}">${fmtCoef(it.coef)}</span></td>
                        <td>${fmtInt(it.last)}</td>
                        <td class="${dynCls}">${fmtDyn(it.dyn)}</td>
                    </tr>`;
                }
                tablesHTML += `<div class="table-wrapper">
                    <div class="table-header">${bandName}</div>
                    <table><thead><tr>
                        <th>№</th><th>ОМСУ</th><th>Коэф.<br>на 10 тыс</th><th>Всего</th><th>Динамика</th>
                    </tr></thead><tbody>${rows}</tbody></table>
                </div>`;
            });

            let topicsHTML = '';
            topics.forEach((t, ti) => {
                const dc = t.dyn < 0 ? 'positive' : t.dyn > 0 ? 'negative' : '';
                topicsHTML += `<div class="topic-item">
                    <span>${ti+1}. ${t.topic} – ${fmtInt(t.count)} (${Math.round(t.share)}%)</span>
                    <span class="${dc}">${fmtDyn(t.dyn)}</span>
                </div>`;
            });

            tabContent.innerHTML = `
                <div class="report-header">
                    <div class="report-title">${prefix} «${synthGroup}»</div>
                    ${periodsHTML}
                </div>
                <div class="summary">
                    Поступило <span class="summary-highlight">${fmtInt(curTotal)}</span> сообщений,
                    <span class="summary-highlight ${dynClass}">${dynText} ${fmtDyn(totalDyn)}</span>
                    ${hasComparison ? `<br><small style="color:#888">сравнение с ${formatDate(cmpStartDate)} — ${formatDate(cmpEndDate)} (${fmtInt(cmpTotal)} сообщений)</small>` : ''}
                </div>
                <div class="tables-container">${tablesHTML}</div>
                <div class="bottom-section">
                    <div class="avg-coef">
                        <div style="font-size:16px;margin-bottom:10px">Среднеобластной коэффициент на 10 тыс.</div>
                        <div class="avg-coef-value">${fmtCoef(oblastCoef)}</div>
                    </div>
                    <div class="topics-list">
                        <h3 style="margin-bottom:15px">Топ-3 подтемы:</h3>
                        ${topicsHTML}
                    </div>
                </div>`;
            reportContainer.appendChild(tabContent);
        }

        // Export buttons
        const pdfBtn = document.createElement('button');
        pdfBtn.className = 'btn btn-secondary';
        pdfBtn.textContent = '📄 Скачать PDF';
        pdfBtn.onclick = exportToPDF;
        reportContainer.appendChild(pdfBtn);

        const pptxBtn = document.createElement('button');
        pptxBtn.className = 'btn btn-secondary';
        pptxBtn.textContent = '💾 Скачать PPTX';
        pptxBtn.onclick = exportToPPTX;
        reportContainer.appendChild(pptxBtn);

        const printBtn = document.createElement('button');
        printBtn.className = 'btn btn-secondary';
        printBtn.style.background = '#17a2b8';
        printBtn.textContent = '🖨️ Печать';
        printBtn.onclick = () => window.print();
        reportContainer.appendChild(printBtn);

        document.getElementById('loading').style.display = 'none';
        document.getElementById('report').style.display = 'block';
        document.getElementById('tabsContainer').style.display = 'block';

    } catch(err) {
        console.error(err);
        alert('Ошибка: ' + err.message);
        document.getElementById('loading').style.display = 'none';
    } finally {
        document.getElementById('generateBtn').disabled = false;
    }
}

function switchTab(idx) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
    document.querySelectorAll('.tab-content').forEach((c, i) => c.classList.toggle('active', i === idx));
}

        async function exportToPDF() {
            const progressDiv = document.getElementById('progress');
            progressDiv.style.display = 'block';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressText').textContent = 'Подготовка PDF...';

            try {
                const groups = globalData.groups;
                const dateFrom = formatDate(globalData.startDate);
                const dateTo = formatDate(globalData.endDate);
                const { jsPDF } = window.jspdf;

                // A4 landscape in mm: 297 x 210
                const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                const pageW = 297, pageH = 210;

                for (let idx = 0; idx < groups.length; idx++) {
                    const { prefix, name: synthGroup } = groups[idx];
                    const result = globalData.groupsResults[synthGroup];

                    document.getElementById('progressFill').style.width = Math.round((idx / groups.length) * 90) + '%';
                    document.getElementById('progressText').textContent = `PDF: ${synthGroup} (${idx + 1}/${groups.length})`;

                    const dynText = result.totalDyn < 0 ? 'снижение' : result.totalDyn > 0 ? 'рост' : 'без изменений';
                    const dynColor = result.totalDyn <= 0 ? '#27ae60' : '#e74c3c';

                    const bandOrder = ['< 100 тыс. человек', '100 - 200 тыс. человек', '> 200 тыс. человек'];
                    let tablesHTML = '';
                    bandOrder.forEach(bandName => {
                        const items = result.bands[bandName];
                        const maxRows = Math.min(items.length, bandName === '< 100 тыс. человек' ? 18 : 14);
                        let rowsHTML = '';
                        for (let i = 0; i < maxRows; i++) {
                            const item = items[i];
                            const rowBg = item.coef >= result.oblastCoef ? '#ffe6e6' :
                                Math.abs(result.oblastCoef - item.coef) < (result.oblastCoef < 1 ? 0.1 : 0.3) ? '#fff9e6' : '#d4edda';
                            const dynC = item.dyn < 0 ? '#28a745' : item.dyn > 0 ? '#dc3545' : '#555';
                            rowsHTML += `<tr style="background:${rowBg}">
                                <td style="padding:2px;text-align:center;border-bottom:1px solid #eee;font-size:8px">${item.rank}</td>
                                <td style="padding:2px 4px;text-align:left;border-bottom:1px solid #eee;font-size:8px">${item.omsu}</td>
                                <td style="padding:2px;text-align:center;border-bottom:1px solid #eee;font-size:8px;font-weight:700;color:#1B3A6B">${fmtCoef(item.coef)}</td>
                                <td style="padding:2px;text-align:center;border-bottom:1px solid #eee;font-size:8px">${fmtInt(item.last)}</td>
                                <td style="padding:2px;text-align:center;border-bottom:1px solid #eee;font-size:8px;font-weight:700;color:${dynC}">${fmtDyn(item.dyn)}</td>
                            </tr>`;
                        }
                        tablesHTML += `<div style="flex:1;border:1px solid #ddd;border-radius:3px;overflow:hidden">
                            <div style="background:#34495E;color:#fff;text-align:center;font-weight:700;font-size:9px;padding:4px">${bandName}</div>
                            <table style="width:100%;border-collapse:collapse">
                                <thead><tr style="background:#ecf0f1">
                                    <th style="padding:3px 2px;font-size:7.5px;border-bottom:1px solid #bdc3c7;text-align:center;color:#444">№</th>
                                    <th style="padding:3px 2px;font-size:7.5px;border-bottom:1px solid #bdc3c7;text-align:center;color:#444">ОМСУ</th>
                                    <th style="padding:3px 2px;font-size:7.5px;border-bottom:1px solid #bdc3c7;text-align:center;color:#444">Коэф.</th>
                                    <th style="padding:3px 2px;font-size:7.5px;border-bottom:1px solid #bdc3c7;text-align:center;color:#444">Всего</th>
                                    <th style="padding:3px 2px;font-size:7.5px;border-bottom:1px solid #bdc3c7;text-align:center;color:#444">Дин.</th>
                                </tr></thead>
                                <tbody>${rowsHTML}</tbody>
                            </table>
                        </div>`;
                    });

                    let topicsHTML = '';
                    result.topics.forEach((t, i) => {
                        const dc = t.dyn < 0 ? '#28a745' : t.dyn > 0 ? '#dc3545' : '#555';
                        topicsHTML += `<div style="display:flex;justify-content:space-between;font-size:8.5px;margin-bottom:3px">
                            <span>${i+1}. ${t.topic} – ${fmtInt(t.count)} (${Math.round(t.share)}%)</span>
                            <span style="font-weight:700;color:${dc}">${fmtDyn(t.dyn)}</span>
                        </div>`;
                    });

                    let compLine = '';
                    if (globalData.hasComparison) {
                        compLine = `<div style="font-size:9px;color:#888;margin-top:2px">сравнение с периодом ${formatDate(globalData.compareStartDate)} — ${formatDate(globalData.compareEndDate)} (${fmtInt(result.cmpTotal)} сообщений)</div>`;
                    }

                    // Render to off-screen div at exact pixel width for A4 landscape
                    const renderDiv = document.createElement('div');
                    // 297mm at 96dpi ≈ 1122px, use scale factor
                    renderDiv.style.cssText = 'position:fixed;left:-9999px;top:0;width:1100px;background:#fff;font-family:Segoe UI,Arial,sans-serif;padding:20px;box-sizing:border-box;';
                    renderDiv.innerHTML = `
                        <div style="background:#1B3A6B;color:#fff;padding:8px 14px;border-radius:5px 5px 0 0;text-align:center">
                            <div style="font-size:18px;font-weight:700">${prefix} «${synthGroup}»</div>
                            <div style="font-size:10px;color:#A8C4E8;margin-top:3px">${dateFrom} — ${dateTo}${globalData.hasComparison ? ' | Сравнение: ' + formatDate(globalData.compareStartDate) + ' — ' + formatDate(globalData.compareEndDate) : ''}</div>
                        </div>
                        <div style="background:#ECF4FB;padding:7px 10px;text-align:center;border-radius:0 0 5px 5px;margin-bottom:10px;font-size:13px">
                            Поступило по всем источникам <strong>${fmtInt(result.curTotal)}</strong> сообщений,
                            <strong style="color:${dynColor}">${dynText} ${fmtDyn(result.totalDyn)}</strong>
                            ${compLine}
                        </div>
                        <div style="display:flex;gap:8px;margin-bottom:10px">${tablesHTML}</div>
                        <div style="display:flex;gap:12px">
                            <div style="flex:1;background:#f8f9fa;border-radius:5px;padding:10px">
                                <div style="font-weight:700;font-size:10px;margin-bottom:6px;color:#1B3A6B">Топ-3 подтемы:</div>
                                ${topicsHTML}
                            </div>
                            <div style="flex:1;background:#EBF5FB;border:1px solid #3498db;border-radius:5px;padding:10px;text-align:center">
                                <div style="font-size:10px;color:#555;margin-bottom:5px">Среднеобластной коэффициент на 10 тыс.</div>
                                <div style="font-size:32px;font-weight:700;color:#1B3A6B">${fmtCoef(result.oblastCoef)}</div>
                            </div>
                        </div>`;

                    document.body.appendChild(renderDiv);
                    await new Promise(r => setTimeout(r, 80));

                    const canvas = await html2canvas(renderDiv, {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: '#ffffff',
                        logging: false,
                        width: 1100,
                        windowWidth: 1200
                    });

                    document.body.removeChild(renderDiv);

                    // Fit canvas into A4 landscape
                    const imgW = pageW - 6; // 6mm total margin
                    const imgH = (canvas.height / canvas.width) * imgW;
                    const yOffset = (pageH - Math.min(imgH, pageH - 6)) / 2;

                    if (idx > 0) pdf.addPage();
                    pdf.addImage(
                        canvas.toDataURL('image/jpeg', 0.92),
                        'JPEG',
                        3, Math.max(3, yOffset),
                        imgW, Math.min(imgH, pageH - 6)
                    );
                }

                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('progressText').textContent = 'Сохранение...';

                pdf.save(`Report_${dateFrom}_to_${dateTo}.pdf`);
                alert('✅ PDF сохранён!');

            } catch (error) {
                console.error(error);
                alert('Ошибка при создании PDF: ' + error.message);
            } finally {
                progressDiv.style.display = 'none';
                // cleanup any leftover render divs
                document.querySelectorAll('div[style*="left:-9999px"]').forEach(el => el.parentNode && el.parentNode.removeChild(el));
            }
        }

        async function exportToPPTX() {
            const progressDiv = document.getElementById('progress');
            progressDiv.style.display = 'block';

            try {
                const pres = new PptxGenJS();
                pres.layout = 'LAYOUT_16x9'; // 10" x 5.625"

                const groups = globalData.groups;
                const dateFrom = formatDate(globalData.startDate);
                const dateTo = formatDate(globalData.endDate);

                for (let idx = 0; idx < groups.length; idx++) {
                    const { prefix, name: synthGroup } = groups[idx];
                    const result = globalData.groupsResults[synthGroup];

                    const progress = Math.round((idx / groups.length) * 100);
                    document.getElementById('progressFill').style.width = progress + '%';
                    document.getElementById('progressText').textContent = `PPTX: ${synthGroup} (${idx + 1}/${groups.length})`;

                    const slide = pres.addSlide();
                    slide.background = { color: 'FFFFFF' };

                    // ── HEADER BLOCK ──────────────────────────────────────────
                    // Dark navy header bar
                    slide.addShape(pres.ShapeType.rect, {
                        x: 0, y: 0, w: 10, h: 0.52,
                        fill: { color: '1B3A6B' }
                    });

                    // Title in header
                    slide.addText(`${prefix} «${synthGroup}»`, {
                        x: 0.15, y: 0, w: 9.7, h: 0.33,
                        fontSize: 14, bold: true, color: 'FFFFFF', align: 'center', valign: 'middle', margin: 0
                    });

                    // Subtitle dates in header
                    let subtitleText = `${dateFrom} — ${dateTo}`;
                    if (globalData.hasComparison) {
                        subtitleText += ` | Сравнение: ${formatDate(globalData.compareStartDate)} — ${formatDate(globalData.compareEndDate)}`;
                    }
                    slide.addText(subtitleText, {
                        x: 0.15, y: 0.33, w: 9.7, h: 0.19,
                        fontSize: 7, color: 'A8C4E8', align: 'center', valign: 'middle', margin: 0
                    });

                    // ── SUMMARY BAR ───────────────────────────────────────────
                    const dynText = result.totalDyn < 0 ? 'снижение' : result.totalDyn > 0 ? 'рост' : 'без изменений';
                    const dynColor = result.totalDyn <= 0 ? '27AE60' : 'E74C3C';

                    const hasComp = globalData.hasComparison;
                    const summaryBarH = hasComp ? 0.42 : 0.28;

                    slide.addShape(pres.ShapeType.rect, {
                        x: 0, y: 0.52, w: 10, h: summaryBarH,
                        fill: { color: 'ECF4FB' }
                    });
                    slide.addText(
                        [
                            { text: 'Поступило по всем источникам ', options: { fontSize: 9, color: '2C3E50' } },
                            { text: `${fmtInt(result.curTotal)} сообщений`, options: { fontSize: 9, bold: true, color: '1B3A6B' } },
                            { text: ', ', options: { fontSize: 9, color: '2C3E50' } },
                            { text: `${dynText} ${fmtDyn(result.totalDyn)}`, options: { fontSize: 9, bold: true, color: dynColor } }
                        ],
                        { x: 0.15, y: 0.52, w: 9.7, h: 0.24, align: 'center', valign: 'middle', margin: 0 }
                    );
                    if (hasComp) {
                        slide.addText(
                            `сравнение с периодом ${formatDate(globalData.compareStartDate)} — ${formatDate(globalData.compareEndDate)} (${fmtInt(result.cmpTotal)} сообщений)`,
                            { x: 0.15, y: 0.76, w: 9.7, h: 0.17, fontSize: 7, color: '95A5A6', align: 'center', valign: 'middle', margin: 0 }
                        );
                    }

                    // ── THREE BAND TABLES ─────────────────────────────────────
                    const bandOrder = ['< 100 тыс. человек', '100 - 200 тыс. человек', '> 200 тыс. человек'];
                    const TABLE_TOP = 0.52 + summaryBarH + 0.04;
                    const TABLE_BOTTOM = 4.22; // leave room for footer
                    const TABLE_H = TABLE_BOTTOM - TABLE_TOP;
                    const GAP = 0.08;
                    const tableWidth = (10 - GAP * 4) / 3; // ~3.11"
                    const positions = [GAP, GAP + tableWidth + GAP, GAP + (tableWidth + GAP) * 2];
                    // col widths inside each table (sum = tableWidth)
                    const colW = [0.28, 1.30, 0.55, 0.50, 0.44];
                    // header row height + col-header row height
                    const BAND_HDR_H = 0.20;
                    const COL_HDR_H = 0.18;

                    for (let bi = 0; bi < 3; bi++) {
                        const bandName = bandOrder[bi];
                        const items = result.bands[bandName];
                        const xPos = positions[bi];

                        // Band header (dark)
                        slide.addShape(pres.ShapeType.rect, {
                            x: xPos, y: TABLE_TOP, w: tableWidth, h: BAND_HDR_H,
                            fill: { color: '34495E' }
                        });
                        slide.addText(bandName, {
                            x: xPos, y: TABLE_TOP, w: tableWidth, h: BAND_HDR_H,
                            fontSize: 7, bold: true, color: 'FFFFFF', align: 'center', valign: 'middle', margin: 0
                        });

                        // Column headers (light gray)
                        const colHdrY = TABLE_TOP + BAND_HDR_H;
                        slide.addShape(pres.ShapeType.rect, {
                            x: xPos, y: colHdrY, w: tableWidth, h: COL_HDR_H,
                            fill: { color: 'D5D8DC' }
                        });
                        const colHeaders = ['№', 'ОМСУ', 'Коэф.', 'Всего', 'Дин.'];
                        let cx = xPos;
                        colHeaders.forEach((ch, ci) => {
                            slide.addText(ch, {
                                x: cx, y: colHdrY, w: colW[ci], h: COL_HDR_H,
                                fontSize: 5.5, bold: true, color: '4A4A4A', align: 'center', valign: 'middle', margin: 0
                            });
                            cx += colW[ci];
                        });

                        // Data rows
                        const dataY = colHdrY + COL_HDR_H;
                        const availH = TABLE_H - BAND_HDR_H - COL_HDR_H;
                        const maxRows = Math.min(items.length, bi === 0 ? 18 : 14);
                        const rowH = availH / maxRows;

                        for (let r = 0; r < maxRows; r++) {
                            const item = items[r];
                            if (!item) break;
                            const rowY = dataY + r * rowH;

                            // Row background
                            let rowColor = 'D5F5E3'; // green
                            if (item.coef >= result.oblastCoef) {
                                rowColor = 'FADBD8'; // red
                            } else {
                                const diff = result.oblastCoef - item.coef;
                                const threshold = result.oblastCoef < 1 ? 0.1 : 0.3;
                                if (diff < threshold) rowColor = 'FEF9E7'; // yellow
                            }
                            slide.addShape(pres.ShapeType.rect, {
                                x: xPos, y: rowY, w: tableWidth, h: rowH,
                                fill: { color: rowColor }, line: { color: 'D5D8DC', width: 0.2 }
                            });

                            // Row cells
                            const cellDefs = [
                                { text: String(item.rank), align: 'center', bold: false, color: '5D6D7E' },
                                { text: item.omsu, align: 'left', bold: false, color: '1C2833' },
                                { text: fmtCoef(item.coef), align: 'center', bold: true, color: '1B3A6B' },
                                { text: fmtInt(item.last), align: 'center', bold: false, color: '2C3E50' },
                                { text: fmtDyn(item.dyn), align: 'center', bold: true,
                                  color: item.dyn < 0 ? '1E8449' : item.dyn > 0 ? 'C0392B' : '7F8C8D' }
                            ];
                            let cx2 = xPos;
                            cellDefs.forEach((cell, ci) => {
                                slide.addText(cell.text, {
                                    x: cx2 + 0.02, y: rowY + 0.01, w: colW[ci] - 0.04, h: rowH - 0.02,
                                    fontSize: 5.5, bold: cell.bold, color: cell.color,
                                    align: cell.align, valign: 'middle', margin: 0
                                });
                                cx2 += colW[ci];
                            });
                        }
                    }

                    // ── FOOTER ────────────────────────────────────────────────
                    const FOOTER_TOP = 4.25;
                    const FOOTER_H = 5.625 - FOOTER_TOP - 0.05;

                    // Left: Top-3 topics
                    slide.addText('Топ-3 подтемы:', {
                        x: 0.12, y: FOOTER_TOP + 0.02, w: 5.4, h: 0.18,
                        fontSize: 7.5, bold: true, color: '1B3A6B', align: 'left', margin: 0
                    });

                    let topicY2 = FOOTER_TOP + 0.21;
                    result.topics.forEach((t) => {
                        const topicDynColor = t.dyn < 0 ? '1E8449' : t.dyn > 0 ? 'C0392B' : '7F8C8D';
                        slide.addText(
                            [
                                { text: `• ${t.topic} – ${fmtInt(t.count)} (${Math.round(t.share)}%)  `, options: { fontSize: 7, color: '2C3E50' } },
                                { text: fmtDyn(t.dyn), options: { fontSize: 7, bold: true, color: topicDynColor } }
                            ],
                            { x: 0.20, y: topicY2, w: 5.2, h: 0.17, align: 'left', valign: 'middle', margin: 0 }
                        );
                        topicY2 += 0.17;
                    });

                    // Right: Oblast coefficient box
                    slide.addShape(pres.ShapeType.rect, {
                        x: 5.8, y: FOOTER_TOP + 0.03, w: 4.0, h: FOOTER_H - 0.06,
                        fill: { color: 'EBF5FB' }, line: { color: '2980B9', width: 0.5 }
                    });
                    slide.addText('Среднеобластной коэффициент', {
                        x: 5.8, y: FOOTER_TOP + 0.06, w: 4.0, h: 0.18,
                        fontSize: 7, color: '5D6D7E', align: 'center', valign: 'middle', margin: 0
                    });
                    slide.addText(`${fmtCoef(result.oblastCoef)}`, {
                        x: 5.8, y: FOOTER_TOP + 0.22, w: 4.0, h: 0.28,
                        fontSize: 16, bold: true, color: '1B3A6B', align: 'center', valign: 'middle', margin: 0
                    });
                    slide.addText('на 10 тыс. жителей', {
                        x: 5.8, y: FOOTER_TOP + 0.48, w: 4.0, h: 0.14,
                        fontSize: 6.5, color: '7F8C8D', align: 'center', valign: 'middle', margin: 0
                    });
                }

                const fileName = `Report_${dateFrom}_to_${dateTo}.pptx`;
                await pres.writeFile({ fileName: fileName });
                alert(`✅ PPTX сохранён: ${fileName}`);

            } catch (error) {
                console.error(error);
                alert('Ошибка при создании PPTX: ' + error.message);
            } finally {
                progressDiv.style.display = 'none';
            }
        }

</script>
